<!DOCTYPE html>
<html>
<head>
  <title>Team Task Manager</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background-color: #f8f9fa;
    }
  </style>
</head>

<body>

<div class="container mt-4">

  <h2 class="text-center mb-4">🚀 Team Task Dashboard</h2>

  <!-- ================= STATS ================= -->
  <div class="row text-center">

    <div class="col">
      <div class="card p-3 shadow">
        <h5>Total Tasks</h5>
        <h3 id="total">0</h3>
      </div>
    </div>

    <div class="col">
      <div class="card p-3 shadow">
        <h5>Completed</h5>
        <h3 id="completed">0</h3>
      </div>
    </div>

    <div class="col">
      <div class="card p-3 shadow">
        <h5>Pending</h5>
        <h3 id="pending">0</h3>
      </div>
    </div>

  </div>

  <!-- ================= CREATE PROJECT ================= -->
  <div class="card p-3 mt-4 shadow">

    <h5>Create Project</h5>

    <input id="projectName" class="form-control mb-2" placeholder="Project Name">
    <button class="btn btn-success" onclick="createProject()">Create Project</button>

  </div>

  <!-- ================= CREATE TASK ================= -->
  <div class="card p-3 mt-4 shadow">

    <h5>Create Task</h5>

    <input id="title" class="form-control mb-2" placeholder="Task Title">
    <input id="project_id" class="form-control mb-2" placeholder="Project ID">
    <input id="assigned_to" class="form-control mb-2" placeholder="Assign User ID">

    <button class="btn btn-primary" onclick="createTask()">Create Task</button>

  </div>

  <!-- ================= TASK LIST ================= -->
  <div class="mt-4">

    <h5>Tasks</h5>

    <button class="btn btn-secondary btn-sm mb-2" onclick="loadTasks()">Refresh Tasks</button>

    <div id="tasks"></div>

  </div>

</div>

<!-- ================= FULL JS (ALL IN ONE FILE) ================= -->
<script>

const API = "http://127.0.0.1:5000";

// 🔐 Token from login
function getToken() {
  return localStorage.getItem("token");
}

/* ================= DASHBOARD ================= */
function loadDashboard() {
  fetch(API + "/dashboard", {
    headers: {
      "Authorization": "Bearer " + getToken()
    }
  })
  .then(res => res.json())
  .then(data => {
    document.getElementById("total").innerText = data.total_tasks;
    document.getElementById("completed").innerText = data.completed_tasks;
    document.getElementById("pending").innerText = data.pending_tasks;
  });
}

/* ================= CREATE PROJECT ================= */
function createProject() {
  fetch(API + "/projects", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "Authorization": "Bearer " + getToken()
    },
    body: JSON.stringify({
      name: document.getElementById("projectName").value
    })
  })
  .then(res => res.json())
  .then(data => {
    alert(data.msg);
  });
}

/* ================= CREATE TASK ================= */
function createTask() {
  fetch(API + "/tasks", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "Authorization": "Bearer " + getToken()
    },
    body: JSON.stringify({
      title: document.getElementById("title").value,
      project_id: document.getElementById("project_id").value,
      assigned_to: document.getElementById("assigned_to").value
    })
  })
  .then(res => res.json())
  .then(data => {
    alert(data.msg);
    loadTasks();
    loadDashboard();
  });
}

/* ================= LOAD TASKS ================= */
function loadTasks() {
  fetch(API + "/tasks", {
    headers: {
      "Authorization": "Bearer " + getToken()
    }
  })
  .then(res => res.json())
  .then(tasks => {

    document.getElementById("tasks").innerHTML =
      tasks.map(t => `
        <div class="card p-2 mt-2 shadow-sm">
          <b>${t.title}</b>
          <span class="badge bg-info">${t.status}</span>
        </div>
      `).join("");

  });
}

/* ================= INIT ================= */
loadDashboard();
loadTasks();

</script>

</body>
</html>
